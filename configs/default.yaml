# Default reference configuration for the ETF MM Arbitrage Simulator.
#
# Three volatility regimes (low / normal / high) at the reference workload
# from Req 11.1: n_paths = 1000, T = 1.0, dt = 0.001 (one trading day in
# arbitrary time units, 1000 inner steps per path).
#
# Note on `mid_price.model`: the schema requires either "gbm" (with
# exactly one regime) or "regime_switching" (with N>=2 regimes plus a
# row-stochastic transition_matrix). The current backtest engine treats
# each configured regime as an independent single-regime cell — see
# `etf_mm_sim/backtest.py` — so the `transition_matrix` below is a
# placeholder kept for schema validation. The Markov path
# generator itself is implemented (`simulate_regime_switching`) but is
# not consumed by `run_backtest` in this iteration.

master_seed: 20240101

horizon:
  T: 1.0
  dt: 0.001

mid_price:
  model: regime_switching
  s0: 100.0
  regimes:
    - name: low
      mu: 0.0
      sigma: 0.5
    - name: normal
      mu: 0.0
      sigma: 1.0
    - name: high
      mu: 0.0
      sigma: 2.0
  # Row-stochastic 3x3 placeholder — see header note above.
  transition_matrix:
    - [0.98, 0.02, 0.0]
    - [0.01, 0.97, 0.02]
    - [0.0, 0.03, 0.97]

quoters:
  avellaneda_stoikov:
    gamma: 0.1
    k: 1.5
    A: 140.0
  symmetric:
    delta_base: 0.05

fill:
  A_b: 140.0
  k_b: 1.5
  A_a: 140.0
  k_a: 1.5

risk:
  q_max: 50
  L_kill: null   # null disables the running-P&L kill switch

mc:
  n_paths: 1000

analytics:
  adverse_selection_horizon_steps: 50
  bootstrap_iterations: 10000
  bootstrap_alpha: 0.05
  # sqrt(252) — convention: T = 1 maps to one trading day.
  sharpe_annualization_factor: 15.874507866387544

output:
  dir: results
  format: parquet
