[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "etf_mm_sim"
version = "0.1.0"
description = "ETF Market Making & Arbitrage Simulator (Mode 1): Avellaneda-Stoikov Monte Carlo backtester on synthetic mid-price paths."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ETF MM Sim Contributors" },
]
keywords = [
    "market-making",
    "avellaneda-stoikov",
    "monte-carlo",
    "backtest",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
jit = [
    "numba>=0.59",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
    "nbclient>=0.10",
    "jupyter",
]

[project.urls]
Homepage = "https://github.com/example/etf-mm-sim"
Repository = "https://github.com/example/etf-mm-sim"
Issues = "https://github.com/example/etf-mm-sim/issues"

[project.scripts]
etf-mm-sim = "etf_mm_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["etf_mm_sim"]

[tool.hatch.build.targets.sdist]
include = [
    "etf_mm_sim/",
    "tests/",
    "configs/",
    "notebooks/",
    "pyproject.toml",
    "pytest.ini",
    "README.md",
]
